; ============================================================================
; Supervisor: worker de colas para Sistema de Tickets (ISTU)
;
; Instalación en Ubuntu:
;   sudo apt install supervisor
;   sudo cp deploy/laravel-worker.conf /etc/supervisor/conf.d/laravel-worker.conf
;   sudo nano /etc/supervisor/conf.d/laravel-worker.conf   # ajustar rutas/usuario
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start laravel-worker:*
;
; Ajustar antes de usar:
;   - directory / command: ruta real del proyecto en el servidor
;   - user: usuario del sistema que corre PHP-FPM (ej. www-data)
;   - numprocs: 2 workers es razonable para el volumen actual de esta app;
;     subir si la cola de correos/broadcasts empieza a acumularse
; ============================================================================

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sistema-tickets/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --backoff=5
directory=/var/www/sistema-tickets
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/sistema-tickets/storage/logs/worker.log
stopwaitsecs=3600

; ============================================================================
; Opcional pero recomendado: Reverb (WebSockets) como servicio persistente.
; Durante la auditoría se confirmó que Reverb no corre como servicio en el
; entorno actual — sin esto, los broadcasts (ComentarioCreado, TicketActualizado)
; se encolan pero nunca se entregan en tiempo real a los navegadores.
; ============================================================================

[program:laravel-reverb]
process_name=%(program_name)s
command=php /var/www/sistema-tickets/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/sistema-tickets
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/sistema-tickets/storage/logs/reverb.log
